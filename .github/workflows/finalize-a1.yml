name: Finalize Assignment 1 evidence

on:
  push:
    paths:
      - ".github/workflows/finalize-a1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-swagger:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run automated tests
        run: |
          PYTHONPATH=. python -m pytest -q

      - name: Start API
        run: |
          python -m uvicorn main:app \
            --host 127.0.0.1 \
            --port 8000 \
            > /tmp/a1-api.log 2>&1 &

          echo $! > /tmp/a1-api.pid

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
              echo "API is ready"
              exit 0
            fi
            sleep 1
          done

          echo "API failed to start"
          cat /tmp/a1-api.log
          exit 1

      - name: Exercise full CRUD through Swagger UI
        run: |
          mkdir -p docs

          python - <<'PY'
          import json
          import re
          import urllib.request
          from datetime import datetime, timezone

          from playwright.sync_api import sync_playwright, expect

          BASE = "http://127.0.0.1:8000"


          def api_json(path):
              with urllib.request.urlopen(BASE + path) as response:
                  return json.load(response)


          def open_operation(page, method, path):
              pattern = re.compile(
                  rf"^{method.upper()}\s+{re.escape(path)}(?:\s|$)"
              )

              summary = page.get_by_role(
                  "button",
                  name=pattern
              ).first

              expect(summary).to_be_visible(timeout=15000)

              block = summary.locator(
                  "xpath=ancestor::div[contains(@class,'opblock')]"
              ).first

              summary.click()

              try_button = block.get_by_role(
                  "button",
                  name="Try it out",
                  exact=True
              )

              if try_button.count() and try_button.is_visible():
                  try_button.click()

              return block


          def execute(block, expected_status):
              execute_button = block.get_by_role(
                  "button",
                  name="Execute",
                  exact=True
              )

              expect(execute_button).to_be_visible(timeout=10000)
              execute_button.click()

              status = block.locator(
                  ".live-responses-table .response-col_status"
              ).first

              expect(status).to_contain_text(
                  str(expected_status),
                  timeout=15000
              )

              return expected_status


          rows = []

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(
                  headless=True
              )

              page = browser.new_page(
                  viewport={
                      "width": 1440,
                      "height": 1800
                  }
              )

              page.goto(
                  BASE + "/docs",
                  wait_until="networkidle",
                  timeout=30000
              )

              # Swagger heading is actually:
              # "Task API 1.0 OAS 3.1"
              heading = page.locator("h1").first
              expect(heading).to_contain_text(
                  "Task API",
                  timeout=15000
              )

              # -------------------------
              # GET /tasks
              # -------------------------
              list_block = open_operation(
                  page,
                  "GET",
                  "/tasks"
              )

              rows.append(
                  (
                      "GET",
                      "/tasks",
                      execute(list_block, 200)
                  )
              )

              # -------------------------
              # POST /tasks
              # -------------------------
              create_block = open_operation(
                  page,
                  "POST",
                  "/tasks"
              )

              create_block.locator(
                  "textarea"
              ).fill(
                  json.dumps({
                      "title": "Swagger verification task"
                  })
              )

              rows.append(
                  (
                      "POST",
                      "/tasks",
                      execute(create_block, 201)
                  )
              )

              created = [
                  task
                  for task in api_json("/tasks")
                  if task["title"]
                  == "Swagger verification task"
              ]

              if len(created) != 1:
                  raise RuntimeError(
                      "Swagger POST did not create exactly "
                      "one verification task"
                  )

              task_id = created[0]["id"]

              if created[0]["done"] is not False:
                  raise RuntimeError(
                      "Created task did not default to done=false"
                  )

              # -------------------------
              # GET /tasks/{task_id}
              # -------------------------
              get_block = open_operation(
                  page,
                  "GET",
                  "/tasks/{task_id}"
              )

              get_block.locator(
                  ".parameters input"
              ).first.fill(
                  str(task_id)
              )

              rows.append(
                  (
                      "GET",
                      f"/tasks/{task_id}",
                      execute(get_block, 200)
                  )
              )

              # -------------------------
              # PUT /tasks/{task_id}
              # -------------------------
              update_block = open_operation(
                  page,
                  "PUT",
                  "/tasks/{task_id}"
              )

              update_block.locator(
                  ".parameters input"
              ).first.fill(
                  str(task_id)
              )

              update_block.locator(
                  "textarea"
              ).fill(
                  json.dumps({
                      "title": "Swagger updated task",
                      "done": True
                  })
              )

              rows.append(
                  (
                      "PUT",
                      f"/tasks/{task_id}",
                      execute(update_block, 200)
                  )
              )

              updated = api_json(
                  f"/tasks/{task_id}"
              )

              if updated != {
                  "id": task_id,
                  "title": "Swagger updated task",
                  "done": True
              }:
                  raise RuntimeError(
                      "Swagger PUT returned unexpected task: "
                      f"{updated!r}"
                  )

              # -------------------------
              # DELETE /tasks/{task_id}
              # -------------------------
              delete_block = open_operation(
                  page,
                  "DELETE",
                  "/tasks/{task_id}"
              )

              delete_block.locator(
                  ".parameters input"
              ).first.fill(
                  str(task_id)
              )

              rows.append(
                  (
                      "DELETE",
                      f"/tasks/{task_id}",
                      execute(delete_block, 204)
                  )
              )

              # -------------------------
              # GET /tasks again
              # -------------------------
              rows.append(
                  (
                      "GET",
                      "/tasks after delete",
                      execute(list_block, 200)
                  )
              )

              remaining = api_json("/tasks")

              if any(
                  task["id"] == task_id
                  for task in remaining
              ):
                  raise RuntimeError(
                      "Deleted task still exists"
                  )

              # Capture actual Swagger UI evidence
              page.screenshot(
                  path="docs/swagger-ui.png",
                  full_page=True
              )

              browser.close()


          timestamp = datetime.now(
              timezone.utc
          ).isoformat()

          with open(
              "docs/swagger-cycle.txt",
              "w",
              encoding="utf-8"
          ) as file:
              file.write(
                  "Swagger UI full CRUD verification\n"
              )

              file.write(
                  f"UTC: {timestamp}\n\n"
              )

              file.write(
                  "Requests executed through Swagger UI "
                  "Try it out / Execute:\n\n"
              )

              for method, path, status in rows:
                  file.write(
                      f"{method} {path} -> {status}\n"
                  )

              file.write(
                  "\nResult: PASS\n"
              )
          PY

      - name: Update submission status
        run: |
          cat > SUBMISSION_STATUS.md <<'EOF'
          # Assignment 1 submission status

          Verified in the final public repository:

          - FastAPI server on localhost:8000
          - exact GET / response
          - exact GET /health response
          - three starter tasks using id/title/done
          - full in-memory CRUD
          - 200 read responses
          - 201 create response
          - 204 delete response
          - 400 invalid-request responses
          - 404 unknown-task responses
          - JSON error responses
          - POST title validation
          - PUT title/body validation
          - Swagger/OpenAPI endpoint descriptions
          - automated test suite
          - real curl -i lifecycle evidence
          - full CRUD cycle executed through Swagger UI
          - Swagger screenshot at docs/swagger-ui.png
          - Swagger CRUD evidence at docs/swagger-cycle.txt
          - Stage 0 through Stage 6 Git history
          - public GitHub repository

          Remaining manual step:

          - Submit the public repository URL through the FlyRank submission interface.
          EOF

      - name: Commit generated evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            docs/swagger-ui.png \
            docs/swagger-cycle.txt \
            SUBMISSION_STATUS.md

          if git diff --cached --quiet; then
            echo "No evidence changes to commit"
          else
            git commit \
              -m "Evidence: verify full CRUD through Swagger UI"

            git push
  
