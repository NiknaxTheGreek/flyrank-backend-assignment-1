name: Finalize Assignment 1 evidence

on:
  push:
    paths:
      - '.github/workflows/finalize-a1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-swagger:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install chromium

      - name: Run automated tests
        run: python -m pytest -q

      - name: Start API
        run: |
          uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/a1-api.log 2>&1 &
          echo $! > /tmp/a1-api.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/a1-api.log
          exit 1

      - name: Exercise full CRUD through Swagger UI and capture screenshot
        run: |
          mkdir -p docs
          python - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone
          from playwright.sync_api import sync_playwright, expect

          BASE = "http://127.0.0.1:8000"

          def api_json(path):
              with urllib.request.urlopen(BASE + path) as response:
                  return json.load(response)

          def operation(page, method, path):
              xpath = (
                  f'//div[contains(concat(" ", normalize-space(@class), " "), " opblock-{method.lower()} ")]'
                  f'[.//span[contains(@class,"opblock-summary-path") and normalize-space(text())="{path}"]]'
              )
              block = page.locator(f"xpath={xpath}").first
              expect(block).to_be_visible()
              block.locator(".opblock-summary").click()
              try_button = block.get_by_role("button", name="Try it out")
              if try_button.count():
                  try_button.click()
              return block

          def run_request(block, expected_status):
              block.get_by_role("button", name="Execute").click()
              live_status = block.locator(".live-responses-table .response-col_status").first
              expect(live_status).to_have_text(str(expected_status), timeout=15000)
              return expected_status

          rows = []
          unique_title = "Swagger verification task"

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width": 1440, "height": 1800})
              page.goto(BASE + "/docs", wait_until="networkidle")
              expect(page.get_by_text("Task API", exact=True).first).to_be_visible()

              # READ list
              block = operation(page, "get", "/tasks")
              rows.append(("GET", "/tasks", run_request(block, 200)))

              # CREATE
              block = operation(page, "post", "/tasks")
              block.locator("textarea").fill(json.dumps({"title": unique_title}))
              rows.append(("POST", "/tasks", run_request(block, 201)))

              created = [t for t in api_json("/tasks") if t["title"] == unique_title]
              if len(created) != 1:
                  raise RuntimeError(f"Expected exactly one created Swagger task, got {created!r}")
              task_id = created[0]["id"]

              # READ one
              block = operation(page, "get", "/tasks/{id}")
              block.locator(".parameters input").first.fill(str(task_id))
              rows.append(("GET", f"/tasks/{task_id}", run_request(block, 200)))

              # UPDATE title + done
              block = operation(page, "put", "/tasks/{id}")
              block.locator(".parameters input").first.fill(str(task_id))
              block.locator("textarea").fill(json.dumps({"title": "Swagger updated task", "done": True}))
              rows.append(("PUT", f"/tasks/{task_id}", run_request(block, 200)))

              updated = api_json(f"/tasks/{task_id}")
              if updated["title"] != "Swagger updated task" or updated["done"] is not True:
                  raise RuntimeError(f"Swagger PUT did not persist expected in-memory state: {updated!r}")

              # DELETE
              block = operation(page, "delete", "/tasks/{id}")
              block.locator(".parameters input").first.fill(str(task_id))
              rows.append(("DELETE", f"/tasks/{task_id}", run_request(block, 204)))

              # READ list again to prove deletion in the UI flow
              block = page.locator(
                  'xpath=//div[contains(concat(" ", normalize-space(@class), " "), " opblock-get ")]'
                  '[.//span[contains(@class,"opblock-summary-path") and normalize-space(text())="/tasks"]]'
              ).first
              # Reuse the already-open GET block and execute again.
              block.get_by_role("button", name="Execute").click()
              expect(block.locator(".live-responses-table .response-col_status").first).to_have_text("200", timeout=15000)
              rows.append(("GET", "/tasks (after delete)", 200))

              remaining = api_json("/tasks")
              if any(t["id"] == task_id for t in remaining):
                  raise RuntimeError("Deleted task still exists after Swagger DELETE")

              page.screenshot(path="docs/swagger-ui.png", full_page=True)
              browser.close()

          timestamp = datetime.now(timezone.utc).isoformat()
          with open("docs/swagger-cycle.txt", "w", encoding="utf-8") as f:
              f.write("Swagger UI full CRUD verification\n")
              f.write(f"UTC: {timestamp}\n")
              f.write("All requests below were executed through Swagger UI Try it out / Execute.\n\n")
              for method, path, status in rows:
                  f.write(f"{method} {path} -> {status}\n")
              f.write("\nResult: PASS\n")
          PY

      - name: Update submission status
        run: |
          cat > SUBMISSION_STATUS.md <<'EOF'
          # Assignment 1 submission status

          Verified in the final public repository:
          - FastAPI server command on localhost:8000
          - exact GET / and GET /health payloads
          - three in-memory starter tasks using id/title/done
          - full CRUD routes
          - 200/201/204/400/404 behavior
          - JSON `error` responses
          - missing/empty POST title rejection
          - empty/invalid PUT rejection
          - route summaries/descriptions in OpenAPI
          - automated test suite
          - real curl -i lifecycle evidence
          - full CRUD cycle exercised through Swagger UI Try it out / Execute
          - real Swagger UI screenshot at docs/swagger-ui.png
          - Swagger CRUD evidence at docs/swagger-cycle.txt
          - honest Stage 0 through Stage 6 commit history
          - public GitHub repository

          Remaining manual step:
          - Submit this public repository URL through the FlyRank submission interface if required.
          EOF

      - name: Commit generated evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/swagger-ui.png docs/swagger-cycle.txt SUBMISSION_STATUS.md
          git commit -m "Evidence: verify full CRUD through Swagger UI"
          git push
